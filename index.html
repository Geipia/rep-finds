<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eraz - Répertoire de Liens</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="icon" type="image/png" href="assets/favicon.png">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary fs-3" href="#"><i class="bi bi-bag-check-fill me-2"></i>Eraz</a>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addItemModal">
        <i class="bi bi-plus-circle me-1"></i> Ajouter un article
      </button>
    </div>
  </nav>

  <!-- Hero Section -->
  <div class="bg-dark py-4 border-bottom border-secondary text-center">
    <div class="container">
      <h1 class="fw-bold fs-2 mb-2">Eraz — Trouvez & Partagez vos meilleurs Finds</h1>
      <p class="text-secondary mb-3">La base de données communautaire pour AliExpress, Temu, LoveGoBuy, HooBuy et plus.</p>
      
      <!-- Search Bar -->
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="input-group input-group-lg">
            <span class="input-group-text bg-secondary border-secondary text-white"><i class="bi bi-search"></i></span>
            <input type="text" id="searchInput" class="form-control bg-dark border-secondary text-white" placeholder="Rechercher un sac Gucci, bonnet LV, baskets Dior...">
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Filters & Catalog -->
  <main class="container my-4">
    <!-- Filter Bar -->
    <div class="row g-2 mb-4">
      <div class="col-6 col-md-3">
        <select id="filterCategory" class="form-select bg-dark border-secondary text-white">
          <option value="">Toutes les catégories</option>
          <option value="Vêtements">Vêtements</option>
          <option value="Chaussures">Chaussures</option>
          <option value="Sacs & Accessoires">Sacs & Accessoires</option>
          <option value="Casquettes & Chapeaux">Casquettes & Chapeaux</option>
          <option value="Bijoux & Horlogerie">Bijoux & Horlogerie</option>
          <option value="Autre">Autre</option>
        </select>
      </div>
      <div class="col-6 col-md-3">
        <select id="filterBrand" class="form-select bg-dark border-secondary text-white">
          <option value="">Toutes les marques</option>
          <option value="Gucci">Gucci</option>
          <option value="Louis Vuitton">Louis Vuitton</option>
          <option value="Dior">Dior</option>
          <option value="Nike">Nike</option>
          <option value="Adidas">Adidas</option>
          <option value="Balenciaga">Balenciaga</option>
          <option value="Prada">Prada</option>
          <option value="Autre">Autre</option>
        </select>
      </div>
      <div class="col-6 col-md-3">
        <select id="filterAgent" class="form-select bg-dark border-secondary text-white">
          <option value="">Tous les fournisseurs</option>
          <option value="AliExpress">AliExpress</option>
          <option value="Temu">Temu</option>
          <option value="LoveGoBuy">LoveGoBuy</option>
          <option value="HooBuy">HooBuy</option>
          <option value="Hipo">Hipo</option>
          <option value="Autre">Autre</option>
        </select>
      </div>
      <div class="col-6 col-md-3">
        <select id="filterShipping" class="form-select bg-dark border-secondary text-white">
          <option value="">Tous frais de port</option>
          <option value="Bas">Bas (0€ - 15€)</option>
          <option value="Moyen">Moyen (15€ - 35€)</option>
          <option value="Élevé">Élevé (> 35€)</option>
        </select>
      </div>
    </div>

    <!-- Articles Grid -->
    <div id="itemsGrid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
      <!-- Rendu dynamique via JS -->
    </div>
    <div id="noResults" class="text-center text-secondary py-5 d-none">
      <i class="bi bi-box-seam fs-1 d-block mb-2"></i>
      <h5>Aucun article trouvé</h5>
      <p>Essaye d'ajuster ta recherche ou d'ajouter le produit !</p>
    </div>
  </main>

  <!-- Modal d'Ajout d'Article -->
  <div class="modal fade" id="addItemModal" tabindex="-1" aria-labelledby="addItemModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark border-secondary text-white">
        <div class="modal-header border-secondary">
          <h5 class="modal-title fw-bold" id="addItemModalLabel"><i class="bi bi-plus-circle me-2"></i>Ajouter un nouvel article</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="addItemForm">
          <div class="modal-body">
            <div class="mb-3">
              <label for="itemTitle" class="form-label">Nom du produit *</label>
              <input type="text" class="form-control bg-dark border-secondary text-white" id="itemTitle" required placeholder="ex: Sacoche Gucci GG Supreme">
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label for="itemBrand" class="form-label">Marque *</label>
                <select class="form-select bg-dark border-secondary text-white" id="itemBrand" required>
                  <option value="">Choisir...</option>
                  <option value="Gucci">Gucci</option>
                  <option value="Louis Vuitton">Louis Vuitton</option>
                  <option value="Dior">Dior</option>
                  <option value="Nike">Nike</option>
                  <option value="Adidas">Adidas</option>
                  <option value="Balenciaga">Balenciaga</option>
                  <option value="Prada">Prada</option>
                  <option value="Autre">Autre</option>
                </select>
              </div>
              <div class="col-6">
                <label for="itemCategory" class="form-label">Catégorie *</label>
                <select class="form-select bg-dark border-secondary text-white" id="itemCategory" required>
                  <option value="">Choisir...</option>
                  <option value="Vêtements">Vêtements</option>
                  <option value="Chaussures">Chaussures</option>
                  <option value="Sacs & Accessoires">Sacs & Accessoires</option>
                  <option value="Casquettes & Chapeaux">Casquettes & Chapeaux</option>
                  <option value="Bijoux & Horlogerie">Bijoux & Horlogerie</option>
                  <option value="Autre">Autre</option>
                </select>
              </div>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label for="itemAgent" class="form-label">Fournisseur / Agent *</label>
                <select class="form-select bg-dark border-secondary text-white" id="itemAgent" required>
                  <option value="">Choisir...</option>
                  <option value="AliExpress">AliExpress</option>
                  <option value="Temu">Temu</option>
                  <option value="LoveGoBuy">LoveGoBuy</option>
                  <option value="HooBuy">HooBuy</option>
                  <option value="Hipo">Hipo</option>
                  <option value="Autre">Autre</option>
                </select>
              </div>
              <div class="col-6">
                <label for="itemShipping" class="form-label">Frais de port *</label>
                <select class="form-select bg-dark border-secondary text-white" id="itemShipping" required>
                  <option value="">Choisir...</option>
                  <option value="Bas">Bas (0€ - 15€)</option>
                  <option value="Moyen">Moyen (15€ - 35€)</option>
                  <option value="Élevé">Élevé (> 35€)</option>
                </select>
              </div>
            </div>
            <div class="mb-3">
              <label for="itemUrl" class="form-label">Lien du produit *</label>
              <input type="url" class="form-control bg-dark border-secondary text-white" id="itemUrl" required placeholder="https://...">
            </div>
            <div class="mb-3">
              <label for="itemImage" class="form-label">Photo du produit (PNG/JPEG) *</label>
              <input type="file" class="form-control bg-dark border-secondary text-white" id="itemImage" accept="image/png, image/jpeg, image/jpg, image/webp" required>
            </div>
          </div>
          <div class="modal-footer border-secondary">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
            <button type="submit" class="btn btn-primary" id="submitBtn">Publier l'article</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- App JS -->
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
  <script src="js/submit.js"></script>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
