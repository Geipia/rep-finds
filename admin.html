<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eraz — Administration</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary fs-3" href="index.html"><i class="bi bi-bag-check-fill me-2"></i>Eraz Admin</a>
      <a href="index.html" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left me-1"></i> Retour au site</a>
    </div>
  </nav>

  <div class="container my-5">
    
    <!-- ECRAN DE CONNEXION -->
    <div id="loginScreen" class="row justify-content-center py-5">
      <div class="col-md-5 col-lg-4">
        <div class="card bg-dark border-secondary text-white shadow-lg p-4">
          <h3 class="fw-bold text-center mb-4"><i class="bi bi-shield-lock me-2 text-primary"></i>Connexion Admin</h3>
          <form id="loginForm">
            <div class="mb-3">
              <label for="adminUser" class="form-label">Identifiant</label>
              <input type="text" id="adminUser" class="form-control bg-dark border-secondary text-white" required placeholder="admin">
            </div>
            <div class="mb-3">
              <label for="adminPass" class="form-label">Mot de passe</label>
              <input type="password" id="adminPass" class="form-control bg-dark border-secondary text-white" required placeholder="••••••••">
            </div>
            <div id="loginError" class="alert alert-danger d-none py-2 small" role="alert">
              Identifiants incorrects.
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Se connecter</button>
          </form>
        </div>
      </div>
    </div>

    <!-- TABLEAU DE BORD ADMIN (MASQUÉ AU DÉPART) -->
    <div id="adminDashboard" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0"><i class="bi bi-speedometer2 me-2 text-primary"></i>Gestion des articles</h2>
        <button id="logoutBtn" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-right me-1"></i> Déconnexion</button>
      </div>

      <div class="table-responsive bg-dark border border-secondary rounded-3 shadow-sm">
        <table class="table table-dark table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>Image</th>
              <th>Produit</th>
              <th>Marque</th>
              <th>Prix</th>
              <th>Fournisseur</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="adminItemsTable">
            <!-- Rendu dynamique JS -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/admin.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
